name: validate-contribution

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate manifest from meta files (main only — single writer)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python scripts/generate_manifest.py
          git config user.name "manifest-bot"
          git config user.email "manifest-bot@users.noreply.github.com"
          git add manifest.jsonl
          git diff --cached --quiet || git commit -m "chore: regenerate manifest.jsonl [skip ci]"
          git push
      - name: Payload schema + manifest + needle sweep
        run: python scripts/validate.py
      - name: Falsification self-tests (identifying payloads MUST fail)
        run: |
          set -e
          mkdir -p /tmp/neg/payloads/2026
          python3 - << 'PYEOF'
          import json, hashlib, pathlib
          base_prov = {"tool_name": "grift", "tool_version": "0.5.5",
                       "definition_version": "x", "origin_definition_version": "x",
                       "activity_definition_version": "x", "analysis_scope": "repo"}
          cases = {
            "9999-email": {"metrics": {"leak": {"email": "someone@example.com"}}},
            "9999-list-smuggle": {"metrics": {"series": [{"actors": ["alice-gh", "bob-gh"]}]}},
          }
          manifest_rows = []
          for cid, metrics in cases.items():
            bad = {"contribution_schema": "tep-contribution-v1",
                   "purpose": "TEP Report 集計と参照分布 vNext",
                   "provenance": base_prov, "metrics": metrics, "context_profile": {}}
            p = pathlib.Path(f"/tmp/neg/payloads/2026/{cid}.json")
            p.write_text(json.dumps(bad, ensure_ascii=False), encoding="utf-8")
            d = hashlib.sha256(p.read_text(encoding="utf-8").encode()).hexdigest()
            manifest_rows.append(json.dumps({"id": cid, "sha256": d,
                                             "received_at": "2026-08-23T00:00:00Z", "door": "pr"}))
          pathlib.Path("/tmp/neg/manifest.jsonl").write_text("\n".join(manifest_rows) + "\n", encoding="utf-8")
          PYEOF
          for cid in 9999-email 9999-list-smuggle; do
            if (cd /tmp/neg && python3 "$GITHUB_WORKSPACE/scripts/validate.py" > "/tmp/neg/$cid.txt" 2>&1); then
              echo "::error::validator accepted identifying payload $cid — falsification failed"
              cat "/tmp/neg/$cid.txt"
              exit 1
            fi
            echo "falsification OK ($cid rejected):"
            tail -1 "/tmp/neg/$cid.txt"
          done
      - name: v2 intake self-tests (real-shaped positives; poisons rejected)
        run: |
          set -e
          rm -rf /tmp/v2t /tmp/v2n && mkdir -p /tmp/v2t/payloads/2026
          python3 - << 'PYEOF'
          import json, hashlib, pathlib
          # The digest emitted by the grift CLI transformer. The validator
          # pins this exact value; a fabricated digest must be rejected.
          REAL_DIGEST = "sha256:42eb35f299c3d97490b459c590279b5a28e0790c393a6ac075f21e89e6b8f502"
          def v2(profile, data, door="public-pr", extra=None, digest=REAL_DIGEST):
              payload = {
                "contribution_schema": "tep-contribution-v2",
                "privacy_profile": profile,
                "door": door,
                "purpose": "TEP Report 集計と参照分布 vNext",
                "provenance_receipt_id": "receipt_abcdefghijklmnopqrstuvwxyz",
                "transformation_spec_digest": digest,
                "policy": {"access_class": "public", "public_payload": True,
                           "source_replay": "controlled_sidecar_required"},
                "data": data,
              }
              if extra:
                  payload.update(extra)
              return payload
          # Real aggregate shape produced by the grift CLI (bucketed only).
          real_measurements = {
            "attribution": {
              "attributed_commit_count_bucket": "100-499",
              "attribution_coverage": {"kind": "observed", "sample_size_bucket": "100-499",
                                       "unit": "ratio", "value_bucket": "90-100%"},
              "bot_count_bucket": "0",
              "human_commit_count_bucket": "100-499",
              "merge_count_bucket": "100-499",
              "observed_actor_count_bucket": "20-99",
              "public_join": {"matched_bucket": "0", "unmatched_bucket": "0"},
              "repo_human_nonmerge_commits_bucket": "100-499",
            }
          }
          real_coverage = {
            "event_window": {"kind": "not_observed", "reason": "unregistered_reason"},
            "forge": {"kind": "not_observed", "provided": False, "reason": "forge_export_not_provided"},
            "git": {"kind": "observed", "provided": True},
            "public_forge": {"kind": "not_observed", "reason": "public_evidence_not_provided"},
            "tracker": {"kind": "not_observed", "provided": False, "reason": "tracker_export_not_provided"},
            "tracker_window": {"kind": "not_observed", "reason": "tracker_export_not_provided"},
            "window_alignment": {"kind": "not_observed", "reason": "event_window_not_provided"},
          }
          real_missingness = [
            {"path": "attribution", "kind": "suppressed", "reason": "unregistered_text"},
            {"path": "input_coverage", "kind": "suppressed", "reason": "unregistered_reason"},
          ]
          agg_data = {"population": {"n_bucket": "20-99", "denominator_bucket": "0"},
                      "measurements": real_measurements,
                      "coverage": real_coverage,
                      "missingness": real_missingness}
          np_actor = {"account": {"provider": "github", "host": "github.com",
                                  "account_id": "12345678", "handle": "example-handle",
                                  "profile_url": "https://github.com/example-handle"},
                      "measurements": {"commit_count_bucket": "20-99"}}
          np_data = {"project": {"provider": "github", "host": "github.com",
                                 "project_id": "123456789", "project_path": "example/project"},
                     "authority": {"basis": "provider-public-api", "scope": "account",
                                   "assertion": "stable numeric account id"},
                     "actors": [np_actor],
                     "measurements": real_measurements,
                     "coverage": real_coverage,
                     "missingness": real_missingness}
          # Reviewer poison (2026-08-31): fabricated judgment keys, fake digest,
          # and an arbitrary measurement body must all be rejected.
          poison_data = {"population": {"n_bucket": "20-99", "denominator_bucket": "0"},
                         "measurements": {"attribution": {
                             "fabricated_reputation_score": {"score": 9999, "verdict": "hire"},
                             "commit_count": 12345}},
                         "coverage": real_coverage,
                         "missingness": real_missingness}
          judgment_nested = {**agg_data,
                             "measurements": {"attribution": {"public_join": {
                                 "score": "99", "verdict": "hire", "matched_bucket": "0"}}}}
          cases = {
            "v2t-aggregate-real": v2("aggregate", agg_data),
            "v2t-named-public-ok": v2("named-public", np_data),
            "v2t-review-poison": v2("aggregate", poison_data, digest="a"*64),
            "v2t-fake-digest": v2("aggregate", agg_data, digest="b"*64),
            "v2t-judgment-nested": v2("aggregate", judgment_nested),
            "v2t-raw-number": v2("aggregate", {**agg_data,
                "measurements": {"attribution": {"merge_count": 54}}}),
            "v2t-unregistered-section": v2("aggregate", {**agg_data,
                "measurements": {"sentiment": {"kind": "observed"}}}),
            "v2t-masked-rejected": v2("masked", agg_data),
            "v2t-raw-rejected": v2("raw", agg_data),
            "v2t-wrong-door": v2("aggregate", agg_data, door="local"),
            "v2t-oid-leak": v2("aggregate",
                {**agg_data, "coverage": {"git": {"kind": "observed", "provided": True,
                                                  "note": "head " + "a"*40}}}),
            "v2t-email-leak": v2("named-public",
                {**np_data, "authority": {**np_data["authority"], "assertion": "someone@example.com"}}),
            "v2t-unknown-key": v2("aggregate", agg_data, extra={"surprise": 1}),
          }
          for cid, payload in cases.items():
              p = pathlib.Path(f"/tmp/v2t/payloads/2026/{cid}.json")
              p.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
              d = hashlib.sha256(p.read_text(encoding="utf-8").encode()).hexdigest()
              meta = {"id": cid, "sha256": d, "received_at": "2026-08-31T00:00:00Z", "door": "pr"}
              (p.parent / f"{cid}.meta.json").write_text(json.dumps(meta), encoding="utf-8")
              with open("/tmp/v2t/all-meta.jsonl", "a", encoding="utf-8") as sink:
                  sink.write(json.dumps(meta) + "\n")
          PYEOF
          # Positives must be accepted in isolation: the validator's exit code
          # is global over a directory, so any co-located negative would
          # falsely reject a valid positive.
          for positive in v2t-aggregate-real v2t-named-public-ok; do
            rm -rf /tmp/v2p && mkdir -p /tmp/v2p/payloads/2026
            cp /tmp/v2t/payloads/2026/$positive.json /tmp/v2p/payloads/2026/
            cp /tmp/v2t/payloads/2026/$positive.meta.json /tmp/v2p/payloads/2026/
            grep "\"$positive\"" /tmp/v2t/all-meta.jsonl > /tmp/v2p/manifest.jsonl
            if (cd /tmp/v2p && python3 "$GITHUB_WORKSPACE/scripts/validate.py" > "/tmp/v2p/$positive.txt" 2>&1); then
              echo "v2 positive accepted: $positive"
            else
              echo "::error::validator rejected valid v2 public payload $positive"
              cat "/tmp/v2p/$positive.txt"; exit 1
            fi
          done
          for must_fail in v2t-review-poison v2t-fake-digest v2t-judgment-nested v2t-raw-number v2t-unregistered-section v2t-masked-rejected v2t-raw-rejected v2t-wrong-door v2t-oid-leak v2t-email-leak v2t-unknown-key; do
            rm -rf /tmp/v2n && mkdir -p /tmp/v2n/payloads/2026
            cp /tmp/v2t/payloads/2026/$must_fail.json /tmp/v2n/payloads/2026/
            cp /tmp/v2t/payloads/2026/$must_fail.meta.json /tmp/v2n/payloads/2026/
            grep "\"$must_fail\"" /tmp/v2t/all-meta.jsonl > /tmp/v2n/manifest.jsonl
            if (cd /tmp/v2n && python3 "$GITHUB_WORKSPACE/scripts/validate.py" > "/tmp/v2n/$must_fail.txt" 2>&1); then
              echo "::error::validator accepted forbidden v2 payload $must_fail — falsification failed"
              cat "/tmp/v2n/$must_fail.txt"; exit 1
            fi
            echo "v2 falsification OK ($must_fail rejected):"
            grep "VALIDATION FAIL" "/tmp/v2n/$must_fail.txt" | head -1
          done
