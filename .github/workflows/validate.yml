name: validate-contribution

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Draft 2020-12 test validator
        run: python -m pip install "jsonschema>=4.23,<5"
      # manifest.jsonl is DERIVED from payloads/**.meta.json and is not committed.
      # The organization ruleset requires every change to main to arrive through a
      # pull request with the gitleaks workflow satisfied, so a bot cannot push a
      # regenerated file to main (run 33900740283, 2026-09-04: "push declined due
      # to repository rule violations"). Regenerate it here on every run and
      # publish it as an artifact; validate.py already derives the same rows.
      - name: Generate manifest from meta files (derived, not committed)
        run: python scripts/generate_manifest.py
      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: manifest.jsonl
          if-no-files-found: error
      - name: Payload schema + manifest + needle sweep
        run: python scripts/validate.py
      - name: Producer fixture, schema, and security contract tests
        run: python -m unittest discover -s tests -v
      # H5-RETIRE: remove this ledger only after a required successor check has
      # rejected the same 17 cases for 30 consecutive main-branch runs with
      # zero unsafe acceptances and preserves an always-uploaded audit artifact.
      - name: Known-accident security ledger
        if: always()
        run: python scripts/falsify_security.py --ledger artifacts/guard-ledger.jsonl
      - name: Upload intake guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intake-guard-ledger
          path: artifacts/guard-ledger.jsonl
          if-no-files-found: error
      - name: Falsification self-tests (identifying payloads MUST fail)
        run: |
          set -e
          mkdir -p /tmp/neg/payloads/2026
          python3 - << 'PYEOF'
          import json, hashlib, pathlib
          base_prov = {"tool_name": "grift", "tool_version": "0.5.5",
                       "definition_version": "x", "origin_definition_version": "x",
                       "activity_definition_version": "x", "analysis_scope": "repo"}
          cases = {
            "9999-email": {"metrics": {"leak": {"email": "someone@example.com"}}},
            "9999-list-smuggle": {"metrics": {"series": [{"actors": ["alice-gh", "bob-gh"]}]}},
          }
          manifest_rows = []
          for cid, metrics in cases.items():
            bad = {"contribution_schema": "tep-contribution-v1",
                   "purpose": "TEP Report 集計と参照分布 vNext",
                   "provenance": base_prov, "metrics": metrics, "context_profile": {}}
            p = pathlib.Path(f"/tmp/neg/payloads/2026/{cid}.json")
            p.write_text(json.dumps(bad, ensure_ascii=False), encoding="utf-8")
            d = hashlib.sha256(p.read_text(encoding="utf-8").encode()).hexdigest()
            manifest_rows.append(json.dumps({"id": cid, "sha256": d,
                                             "received_at": "2026-08-23T00:00:00Z", "door": "pr"}))
          pathlib.Path("/tmp/neg/manifest.jsonl").write_text("\n".join(manifest_rows) + "\n", encoding="utf-8")
          PYEOF
          for cid in 9999-email 9999-list-smuggle; do
            if (cd /tmp/neg && python3 "$GITHUB_WORKSPACE/scripts/validate.py" > "/tmp/neg/$cid.txt" 2>&1); then
              echo "::error::validator accepted identifying payload $cid — falsification failed"
              cat "/tmp/neg/$cid.txt"
              exit 1
            fi
            echo "falsification OK ($cid rejected):"
            tail -1 "/tmp/neg/$cid.txt"
          done
